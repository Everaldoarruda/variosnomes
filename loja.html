<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja de Camisetas</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Loja de Camisetas</h1>
    <div class="produto">
        <img src="https://i.pinimg.com/474x/d3/47/43/d347434745d049b240fe7db553bab76a.jpg alt="Camiseta Preta" width="150">
        <h2>Camiseta Preta</h2>
        <p>R$ 50,00</p>
        <button onclick="adicionarAoCarrinho('Camiseta Preta', 50)">Adicionar ao carrinho</button>
    </div>
    
    <div class="produto">
        <img src="https://i.pinimg.com/474x/07/79/2f/07792fe67970349f9b969649a2fffe78.jpg" alt="Camiseta Branca" width="150">
        <h2>Camiseta Branca</h2>
        <p>R$ 45,00</p>
        <button onclick="adicionarAoCarrinho('Camiseta Branca', 45)">Adicionar ao carrinho</button>
    </div>

    <h2>Carrinho</h2>
    <ul id="carrinho"></ul>
    <script src="script.js"></script>
</body>
</html>
