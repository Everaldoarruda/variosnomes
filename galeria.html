<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
    <title>Galeria</title>
</head>
<body class="background">
    <header>
        <img src="img/logo-registrado-black (1).png" alt="logomarca registrada de vários nomes">
        <nav class="menu">
            <ul>
                <li><a href="../index.html">Murais</a></li>
                <li><a href="../galeria.html">Canvas</a></li>
                <li><a href="Videos.html">Videos</a></li>
                <li><a href="sobre.html">Sobre</a></li>
                <li><a href="loja.html">loja</a></li>
                <li><a href="../contato.html">Contato</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <div class="galeria-container">
            <div class="itens-galeria" onclick="abrirImagem('img/Rainha.png', 'Descrição da imagem 1')">
                <img src="img/Rainha.png" alt="Descrição da imagem 1">
                <span>Descrição da imagem 1</span>
            </div>

            <!-- <div class="itens-galeria" onclick="abrirImagem('img/IMG_9555.jpg', 'Descrição da imagem 3')">
                <img src="img/IMG_9555.jpg" alt="Descrição da imagem 3">
                <span>Descrição da imagem 3</span>
            </div> -->
            <div class="itens-galeria" onclick="abrirImagem('img/IMG_0263.jpg', 'Descrição da imagem 4')">
                <img src="img/IMG_0263.jpg" alt="Descrição da imagem 4">
                <span>Descrição da imagem 4</span>
            </div>
            <div class="itens-galeria" onclick="abrirImagem('img/nova 2025.1.png', 'Descrição da imagem 5')">
                <img src="img/nova 2025.1.png" alt="Descrição da imagem 5">
                <span>Descrição da imagem 5</span>
            </div>
            <div class="itens-galeria" onclick="abrirImagem('img/nova 2025 2.png', 'Descrição da imagem 6')">
                <img src="img/nova 2025 2.png" alt="Descrição da imagem 6">
                <span>Descrição da imagem 6</span>
            </div>
        </div>

        <!-- Modal para exibir a imagem maior com lupa -->
        <div id="imagem-modal" class="imagem-modal hidden">
            <button class="voltar" onclick="fecharImagem()">← Voltar</button>
            <div class="zoom-container">
                <img id="imagem-grande" src="" alt="">
            </div>
            <p id="descricao-imagem"></p>
        </div>
    </main>
    <footer>
        <span>&copy; 2025 | Vários Nomes</span>
    </footer>
    <script>
        function abrirImagem(src, descricao) {
            document.getElementById('imagem-modal').classList.remove('hidden');
            document.getElementById('imagem-grande').src = src;
            document.getElementById('descricao-imagem').textContent = descricao;
        }

        function fecharImagem() {
            document.getElementById('imagem-modal').classList.add('hidden');
        }

        // Função para aplicar zoom na imagem
        const imagemGrande = document.getElementById('imagem-grande');
        const zoomContainer = document.querySelector('.zoom-container');

        zoomContainer?.addEventListener('mousemove', (e) => {
            const rect = zoomContainer.getBoundingClientRect();
            const x = ((e.clientX - rect.left) / rect.width) * 100;
            const y = ((e.clientY - rect.top) / rect.height) * 100;
            imagemGrande.style.transformOrigin = `${x}% ${y}%`;
            imagemGrande.style.transform = 'scale(2)';
        });

        zoomContainer?.addEventListener('mouseleave', () => {
            imagemGrande.style.transform = 'scale(1)';
            imagemGrande.style.transformOrigin = 'center center';
        });
    </script>
</body>
</html>
