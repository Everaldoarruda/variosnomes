<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6zMFYlzc" crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprGAnm3QDgpJLIm9Nao0TUVF6z" crossorigin="anonymous">
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
    <title>Vários Nomes</title>
</head>
<body>
    <header>
        <div class="logo">
            <a href="index.html">
                <img src="img/logo-registrado-black (1).png" alt="Logomarca registrada de vários nomes">
            </a>
        </div>
        <nav class="menu">
            <ul>
                <li><a href="index.html">Murais</a></li>
                <li><a href="galeria.html">Canvas</a></li>
                <li><a href="Videos.html">Vídeos</a></li>
                <li><a href="sobre.html">Sobre</a></li>
                <li><a href="loja.html">Loja</a></li>
                <li><a href="contato.html">Contato</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <div class="galeria-container">
            <div class="itens-galeria" onclick="abrirImagem('img/Cópia de João Borges.JPG', 'Descrição da imagem 1')">
                <img src="img/Cópia de João Borges.JPG" alt="Descrição da imagem 1">
                <span>"A Rua cria, a cidade dança"
                        Rua da saudade - Recife | PE
                        2024.
                </span>
            </div>
            <div class="itens-galeria" onclick="abrirImagem('img/Foto_João Borges-7.JPG', 'Descrição da imagem 2')">
                <img src="img/Foto_João Borges-7.JPG" alt="Descrição da imagem 2">
                <span>Descrição da imagem 2</span>
            </div>
            <div class="itens-galeria" onclick="abrirImagem('img/Foto_João Borges-20.JPG', 'Descrição da imagem 3')">
                <img src="img/Foto_João Borges-20.JPG" alt="Descrição da imagem 3">
                <span>Descrição da imagem 3</span>
            </div>
            <div class="itens-galeria" onclick="abrirImagem('img/João_Borges-4.jpg', 'Descrição da imagem 4')">
                <img src="img/João_Borges-4.jpg" alt="Descrição da imagem 4">
                <span>Descrição da imagem 4</span>
            </div>
            <div class="itens-galeria" onclick="abrirImagem('img/João_Borges-5.jpg', 'Descrição da imagem 5')">
                <img src="img/João_Borges-5.jpg" alt="Descrição da imagem 5">
                <span>Descrição da imagem 5</span>
            </div>
            <div class="itens-galeria" onclick="abrirImagem('img/Sesc Casa Amarela Entre Ruas 30-09-23 Gui Lost (30).jpeg', 'Descrição da imagem 6')">
                <img src="img/Sesc Casa Amarela Entre Ruas 30-09-23 Gui Lost (30).jpeg" alt="Descrição da imagem 6">
                <span>Descrição da imagem 6</span>
            </div>
        </div>

        <!-- Modal para exibir a imagem maior -->
        <div id="imagem-modal" class="imagem-modal hidden">
            <button class="voltar" onclick="fecharImagem()">← Voltar</button>
            <img id="imagem-grande" src="" alt="">
            <p id="descricao-imagem"></p>
        </div>
    </main>
    <footer>
        <span>&copy; 2025 | Vários Nomes</span>
        <!-- adicionar icones das redes sociais -->
    </footer>
    <script>
        function abrirImagem(src, descricao) {
            document.getElementById('imagem-modal').classList.remove('hidden');
            document.getElementById('imagem-grande').src = src;
            document.getElementById('descricao-imagem').textContent = descricao;
        }

        function fecharImagem() {
            document.getElementById('imagem-modal').classList.add('hidden');
        }
    </script>
</body>
</html>
